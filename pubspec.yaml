name: oneconnect
description: A private one-to-one messaging app for partners, friends, and others.
publish_to: 'none'
version: 1.0.2
environment:
  sdk: ^3.10.0

dependencies:
  audioplayers: ^6.8.1
  cloud_firestore: ^7.1.0
  cryptography: ^2.9.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  ota_update: ^7.1.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - app_logo.png
    - assets/sounds/action_success.wav
